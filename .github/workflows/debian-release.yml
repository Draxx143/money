name: Build and upload Debian package

on:
  push:
    branches:
      - arena/f97b8e10-money
    paths:
      - .github/workflows/debian-release.yml
      - scripts/build-deb.sh
      - src/**
      - packaging/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: indigo-screen-v1-release
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Debian package
        run: sh scripts/build-deb.sh
      - name: Verify package
        run: |
          dpkg-deb --info dist/indigo-screen_1.0.0_all.deb
          dpkg-deb --contents dist/indigo-screen_1.0.0_all.deb
      - name: Upload package to existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view v1.0.0
          gh release upload v1.0.0 dist/indigo-screen_1.0.0_all.deb --clobber
