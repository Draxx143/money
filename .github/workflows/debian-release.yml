name: Build and upload Debian package

on:
  push:
    branches:
      - arena/f97b8e10-money
    paths:
      - .github/workflows/debian-release.yml
      - scripts/build-deb.sh
      - src/**
      - packaging/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: indigo-screen-v1-release
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GUI test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-gtk-4.0 xvfb xauth
      - name: Test with GTK 3 and GTK 4 installed
        run: |
          if ! xvfb-run -a /usr/bin/python3 tests/smoke.py > /tmp/smoke.log 2>&1; then
            cat /tmp/smoke.log
            while IFS= read -r line; do echo "::error::$line"; done < /tmp/smoke.log
            exit 1
          fi
          cat /tmp/smoke.log
      - name: Build Debian package
        run: sh scripts/build-deb.sh
      - name: Verify package
        run: |
          dpkg-deb --info dist/indigo-screen_1.0.1_all.deb
          dpkg-deb --contents dist/indigo-screen_1.0.1_all.deb
      - name: Upload package to existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view v1.0.1
          gh release upload v1.0.1 dist/indigo-screen_1.0.1_all.deb --clobber
